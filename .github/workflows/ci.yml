name: SUDO SPANDR CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install httpx


      - name: Run Forensic Claims Audit
        run: |
          node scripts/check-forensic-claims.mjs

      - name: Run Backend Smoke Tests
        run: |
          python3 backend/api_smoke_test.py

      - name: Run Comprehensive Feature Test Suite
        run: |
          python3 backend/test_all_new_features.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies & Build
        run: |
          npm ci || npm install
          npm run build
