[supervisord]
nodaemon=true
user=spandrvm
logfile=/var/lib/spandrvm/supervisord.log
pidfile=/var/lib/spandrvm/supervisord.pid
childlogdir=/var/lib/spandrvm

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x800x24 -nolisten tcp -ac
autorestart=true
priority=100
stdout_logfile=/var/lib/spandrvm/xvfb.log
stderr_logfile=/var/lib/spandrvm/xvfb-error.log

[program:fluxbox]
command=/usr/bin/fluxbox -display :99
environment=DISPLAY=":99",HOME="/var/lib/spandrvm"
directory=/var/lib/spandrvm
autorestart=true
priority=200
stdout_logfile=/var/lib/spandrvm/fluxbox.log
stderr_logfile=/var/lib/spandrvm/fluxbox-error.log

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -listen 127.0.0.1 -xkb -forever -shared -passwdfile /var/lib/spandrvm/vnc.pass
environment=DISPLAY=":99",HOME="/var/lib/spandrvm"
autorestart=true
priority=300
stdout_logfile=/var/lib/spandrvm/x11vnc.log
stderr_logfile=/var/lib/spandrvm/x11vnc-error.log

[program:novnc]
command=/usr/bin/websockify --web /var/lib/spandrvm/novnc 127.0.0.1:7860 127.0.0.1:5900
autorestart=true
priority=400
stdout_logfile=/var/lib/spandrvm/novnc.log
stderr_logfile=/var/lib/spandrvm/novnc-error.log

[program:chromium]
command=/usr/bin/chromium --disable-dev-shm-usage --disable-gpu --no-first-run --no-default-browser-check --disable-session-crashed-bubble --hide-crash-restore-bubble --window-size=1000,620 --window-position=250,90 --user-data-dir=/var/lib/spandrvm/.config/chromium about:blank
environment=DISPLAY=":99",HOME="/var/lib/spandrvm"
directory=/var/lib/spandrvm/share
autorestart=false
priority=500
stdout_logfile=/var/lib/spandrvm/chromium.log
stderr_logfile=/var/lib/spandrvm/chromium-error.log

[program:terminal]
command=/usr/bin/xterm -display :99 -geometry 78x22+24+90 -fn fixed -title Agent-Terminal -e /bin/bash
environment=DISPLAY=":99",HOME="/var/lib/spandrvm",TERM="xterm-256color"
directory=/var/lib/spandrvm/share
autorestart=false
priority=510
stdout_logfile=/var/lib/spandrvm/terminal.log
stderr_logfile=/var/lib/spandrvm/terminal-error.log
